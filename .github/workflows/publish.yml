# Publishes the extension to the Visual Studio Marketplace with no stored secret, and attaches the .vsix to a GitHub Release.
# This file is written by the Plotwork monorepo's build (apps/azure-devops/repo/.github/workflows/publish.yml there); a change
# made here is overwritten by the next release.
#
# GitHub's OIDC token signs in to Microsoft Entra through a federated credential on the app registration "Plotwork Marketplace
# publisher"; Entra gives a short-lived token for Azure DevOps, and tfx publishes with it. That app's service principal is a
# member of the publisher `plotwork`.
#
# A push of a tag v<version>, which the monorepo's release workflow makes after it mirrors the built tree, publishes on its own:
#
#   tag              extension in the tree                Marketplace
#   v0.2.0           plotwork-diagrams                     public or private, as vss-extension.json says; a private one is
#                                                          shared with AZURE_DEVOPS_SHARE_WITH when that is set
#   v0.2.0-beta.3    plotwork-diagrams-preview, 0.2.3      private, "public": false forced, shared with AZURE_DEVOPS_SHARE_WITH
#
# then creates the GitHub Release of the tag (a prerelease for a beta) with the .vsix it published, and signs a build provenance
# attestation for that .vsix.
#
# Repository variables (Settings, Secrets and variables, Actions, Variables):
#   AZURE_CLIENT_ID           the app registration's Application (client) ID
#   AZURE_TENANT_ID           its Directory (tenant) ID
#   AZURE_DEVOPS_SHARE_WITH   the Azure DevOps organisation the preview extension is shared with, such as plotwork-test
# Environment: `marketplace`, which the federated credential names. Its deployment rules must allow the tags v*.
#
# Run it from the Actions tab, for the manual cases:
#   whoami: true                  prints the service principal's Marketplace ID, to add it to the publisher (one time)
#   share-with: <organisation>    publishes the default branch privately, shared with that Azure DevOps organisation
#   smoke: true                   runs only the smoke pipeline (below) against what the organisation has installed
#   neither                       publishes the default branch as the manifest says
#
# After a publish of a tag, the job smoke runs the extension in a real pipeline: the Azure DevOps organisation in
# AZURE_DEVOPS_SHARE_WITH, its project AZURE_DEVOPS_SMOKE_PROJECT, and the pipeline AZURE_DEVOPS_SMOKE_PIPELINE (its numeric id),
# made from .azure-pipelines/plotwork-smoke.yml of plotwork-official/plotwork-examples. It signs in as the publish does, so the
# service principal must also be a user of that organisation, in the project's Contributors. Without the three variables it says
# so and passes.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      whoami:
        description: Only print the service principal's Marketplace ID
        type: boolean
        default: false
      share-with:
        description: Share a private extension with this Azure DevOps organisation
        type: string
        default: ""
      smoke:
        description: Only run the smoke pipeline against the version the organisation has
        type: boolean
        default: false

permissions: {}

# One publish at a time, and a publish in flight is never cancelled: the Marketplace refuses a version twice.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the Marketplace
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.smoke) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: marketplace
    permissions:
      contents: read
      id-token: write # the OIDC token Microsoft Entra signs in with
    outputs:
      vsix: ${{ steps.plan.outputs.vsix }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # On a tag, the manifest must be the one the monorepo built for that version: the preview extension, private, at the
      # numeric version of a beta (patch * 1000 + N), or the stable extension at the version itself. Anything else stops here,
      # before the sign-in.
      - name: Decide what to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          WHOAMI: ${{ inputs.whoami }}
          SHARE_INPUT: ${{ inputs.share-with }}
          SHARE_VAR: ${{ vars.AZURE_DEVOPS_SHARE_WITH }}
        run: |
          set -euo pipefail
          id=$(node -p "require('./vss-extension.json').id")
          publisher=$(node -p "require('./vss-extension.json').publisher")
          version=$(node -p "require('./vss-extension.json').version")
          public=$(node -p "Boolean(require('./vss-extension.json').public)")
          prerelease=false
          share=""
          override=""
          if [ "$REF_TYPE" = "tag" ]; then
            tagged="${REF_NAME#v}"
            if [[ "$tagged" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([1-9][0-9]*)$ ]]; then
              prerelease=true
              expected="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$(( BASH_REMATCH[3] * 1000 + BASH_REMATCH[4] ))"
              case "$id" in *-preview) ;; *) echo "::error::$REF_NAME is a beta, but vss-extension.json is the extension $id, not a preview one."; exit 1 ;; esac
              if [ "$public" != "false" ]; then echo "::error::$REF_NAME is a beta, and its manifest is public. A beta is never public."; exit 1; fi
              if [ -z "$SHARE_VAR" ]; then echo "::error::Set the repository variable AZURE_DEVOPS_SHARE_WITH to the Azure DevOps organisation that tests betas."; exit 1; fi
              share="$SHARE_VAR"
              override='{"public": false}'
            elif [[ "$tagged" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              expected="$tagged"
              case "$id" in *-preview) echo "::error::$REF_NAME is a stable version, but vss-extension.json is the preview extension $id."; exit 1 ;; esac
              if [ "$public" = "false" ]; then share="$SHARE_VAR"; fi
            else
              echo "::error::$REF_NAME is not a release tag such as v0.2.0 or v0.2.0-beta.3."
              exit 1
            fi
            if [ "$version" != "$expected" ]; then
              echo "::error::$REF_NAME should publish version $expected, and vss-extension.json has $version."
              exit 1
            fi
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$WHOAMI" != "true" ]; then
            share="$SHARE_INPUT"
          fi
          {
            echo "prerelease=$prerelease"
            echo "share=$share"
            echo "override=$override"
            echo "vsix=$publisher.$id-$version.vsix"
            echo "publisher=$publisher"
            echo "id=$id"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $publisher.$id $version (public in the manifest: $public; shared with: ${share:-nobody})." >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Microsoft Entra with GitHub's OIDC token
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Print the service principal's Marketplace ID
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.whoami }}
        # 499b84ac-1321-427f-aa17-267ca6975798 is Azure DevOps as an Entra resource.
        run: |
          az rest -u "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1" --resource 499b84ac-1321-427f-aa17-267ca6975798 -o json

      # Packed once, so the file published is the file attached to the release. tfx gives up waiting on the Marketplace's
      # validation after a few minutes, and a new extension's first validation can take longer, so tfx does not wait: the
      # step asks for the status itself, every 30 seconds for up to 30 minutes. A version the Marketplace already has (a run
      # again after such a timeout) is not sent twice, which the Marketplace would refuse; its validation is waited on.
      - name: Pack and publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.whoami) }}
        env:
          SHARE_WITH: ${{ steps.plan.outputs.share }}
          OVERRIDE: ${{ steps.plan.outputs.override }}
          VSIX: ${{ steps.plan.outputs.vsix }}
          PUBLISHER: ${{ steps.plan.outputs.publisher }}
          EXTENSION_ID: ${{ steps.plan.outputs.id }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          override=()
          if [ -n "$OVERRIDE" ]; then override=(--override "$OVERRIDE"); fi
          npx --yes tfx-cli@0.24.2 extension create --root . --manifest-globs vss-extension.json --output-path "$RUNNER_TEMP/out/$VSIX" --no-prompt "${override[@]}"
          new_token() {
            token="$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)"
            echo "::add-mask::$token"
          }
          # success, pending, or error (with the Marketplace's message, or "not published" for a version it does not have).
          status() {
            npx --yes tfx-cli@0.24.2 extension isvalid --publisher "$PUBLISHER" --extension-id "$EXTENSION_ID" --version "$VERSION" --auth-type pat --token "$token" --no-prompt --json 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s.slice(s.indexOf("{")));console.log(r.status==="error"?"error "+(r.message??""):r.status)}catch{console.log("error not published")}})'
          }
          new_token
          before="$(status)"
          if [ "$before" = "success" ] || [ "$before" = "pending" ]; then
            echo "The Marketplace already has $EXTENSION_ID $VERSION ($before), so it is not sent again."
          else
            share=()
            if [ -n "$SHARE_WITH" ]; then share=(--share-with "$SHARE_WITH"); fi
            npx --yes tfx-cli@0.24.2 extension publish --vsix "$RUNNER_TEMP/out/$VSIX" --auth-type pat --token "$token" --no-prompt --no-wait-validation "${share[@]}"
          fi
          for attempt in $(seq 1 60); do
            # The Entra token lasts about an hour; a fresh one every ten tries keeps the wait inside it.
            if [ $(( attempt % 10 )) -eq 0 ]; then new_token; fi
            now="$(status)"
            case "$now" in
              success) echo "Published $VSIX, and the Marketplace validated it." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              pending) echo "Validation pending ($attempt of 60)."; sleep 30 ;;
              *) echo "::error::The Marketplace refused $VSIX: ${now#error }"; exit 1 ;;
            esac
          done
          echo "::error::$VSIX was sent, and the Marketplace had not validated it after 30 minutes. Run this workflow again to keep waiting; the version is not sent twice."
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ github.ref_type == 'tag' }}
        with:
          name: vsix
          path: ${{ runner.temp }}/out/${{ steps.plan.outputs.vsix }}
          if-no-files-found: error
          retention-days: 14

  # The GitHub Release of the tag, with the .vsix the Marketplace got and a signed build provenance for it. Only this job can
  # write to the repository. Check a downloaded .vsix with:
  #   gh attestation verify plotwork.plotwork-diagrams-<version>.vsix --repo plotwork-official/plotwork-azure-devops
  release:
    name: Attach the .vsix to the GitHub Release
    needs: publish
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creating the release of the tag
      actions: read # downloading the artifact of this run
      id-token: write # signing the provenance with Sigstore
      attestations: write # storing the attestation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VSIX: ${{ needs.publish.outputs.vsix }}
      PRERELEASE: ${{ needs.publish.outputs.prerelease }}
    steps:
      - name: Fetch the published .vsix
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name vsix --dir out
          test -s "out/$VSIX"

      - name: Sign the provenance of the .vsix
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ needs.publish.outputs.vsix }}

      - name: Create the release
        run: |
          set -euo pipefail
          flags=()
          notes="The extension as published to the Visual Studio Marketplace."
          if [ "$PRERELEASE" = "true" ]; then
            flags=(--prerelease)
            notes="A beta, published as the private preview extension. The extension as published to the Visual Studio Marketplace."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$VSIX" --clobber
          else
            gh release create "$TAG" "out/$VSIX" --verify-tag --title "$TAG" --notes "$notes" "${flags[@]}"
          fi
          echo "Attached $VSIX to the release $TAG." >> "$GITHUB_STEP_SUMMARY"

  # The extension in a real pipeline: waits until the organisation has the version this run published, queues the smoke
  # pipeline with the latest stable command line, and passes when every Plotwork step of the run passed on the task version
  # this release wrote.
  smoke:
    name: Run the extension in Azure Pipelines
    needs: publish
    if: ${{ !cancelled() && ((github.ref_type == 'tag' && needs.publish.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.smoke)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: marketplace
    permissions:
      contents: read
      id-token: write # the OIDC token Microsoft Entra signs in with
    env:
      ORG: ${{ vars.AZURE_DEVOPS_SHARE_WITH }}
      PROJECT: ${{ vars.AZURE_DEVOPS_SMOKE_PROJECT }}
      PIPELINE: ${{ vars.AZURE_DEVOPS_SMOKE_PIPELINE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read what to test
        id: what
        run: |
          set -euo pipefail
          if [ -z "$ORG" ] || [ -z "$PROJECT" ] || [ -z "$PIPELINE" ]; then
            echo "::notice::No smoke pipeline: set AZURE_DEVOPS_SHARE_WITH, AZURE_DEVOPS_SMOKE_PROJECT and AZURE_DEVOPS_SMOKE_PIPELINE to run one."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          task=$(node -p "require('./tasks/PlotworkDiagrams/task.json').name")
          {
            echo "run=true"
            echo "publisher=$(node -p "require('./vss-extension.json').publisher")"
            echo "id=$(node -p "require('./vss-extension.json').id")"
            echo "version=$(node -p "require('./vss-extension.json').version")"
            echo "task=$task"
            echo "task_version=$(node -p "const v=require('./tasks/PlotworkDiagrams/task.json').version; v.Major+'.'+v.Minor+'.'+v.Patch")"
            if [ "$task" = "PlotworkDiagramsPreview" ]; then echo "channel=preview"; else echo "channel=stable"; fi
            echo "cli=$(npm view @buun_group/plotwork version)"
          } >> "$GITHUB_OUTPUT"

      - name: Sign in to Microsoft Entra with GitHub's OIDC token
        if: ${{ steps.what.outputs.run == 'true' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Run the smoke pipeline
        if: ${{ steps.what.outputs.run == 'true' }}
        env:
          PUBLISHER: ${{ steps.what.outputs.publisher }}
          EXTENSION_ID: ${{ steps.what.outputs.id }}
          VERSION: ${{ steps.what.outputs.version }}
          TASK: ${{ steps.what.outputs.task }}
          TASK_VERSION: ${{ steps.what.outputs.task_version }}
          CHANNEL: ${{ steps.what.outputs.channel }}
          CLI: ${{ steps.what.outputs.cli }}
        run: |
          set -euo pipefail
          new_token() {
            token="$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)"
            echo "::add-mask::$token"
          }
          ado() { curl -sS --fail-with-body -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "$@"; }
          new_token

          # An installed extension takes the new version on its own, usually within minutes.
          installed=""
          for attempt in $(seq 1 60); do
            if [ $(( attempt % 10 )) -eq 0 ]; then new_token; fi
            installed=$(ado "https://extmgmt.dev.azure.com/$ORG/_apis/extensionmanagement/installedextensionsbyname/$PUBLISHER/$EXTENSION_ID?api-version=7.1-preview.1" 2>/dev/null | jq -r '.version // empty' || true)
            if [ "$installed" = "$VERSION" ]; then break; fi
            echo "$ORG has ${installed:-no install of $EXTENSION_ID}; waiting for $VERSION ($attempt of 60)."
            sleep 30
          done
          if [ "$installed" != "$VERSION" ]; then
            if [ -z "$installed" ]; then
              echo "::error::$PUBLISHER.$EXTENSION_ID is not installed in $ORG, or the service principal cannot read it. Install it under Organization settings, Extensions, and add the service principal to the organisation."
            else
              echo "::error::$ORG still has $EXTENSION_ID $installed after 30 minutes, not $VERSION."
            fi
            exit 1
          fi

          body=$(jq -n --arg channel "$CHANNEL" --arg cli "$CLI" '{templateParameters: {channel: $channel, cliVersion: $cli}}')
          run=$(ado -X POST "https://dev.azure.com/$ORG/$PROJECT/_apis/pipelines/$PIPELINE/runs?api-version=7.1" -d "$body")
          id=$(jq -r '.id' <<<"$run")
          link=$(jq -r '._links.web.href' <<<"$run")
          echo "Queued run $id with $TASK and @buun_group/plotwork@$CLI: $link"

          state=""
          for attempt in $(seq 1 60); do
            if [ $(( attempt % 10 )) -eq 0 ]; then new_token; fi
            now=$(ado "https://dev.azure.com/$ORG/$PROJECT/_apis/pipelines/$PIPELINE/runs/$id?api-version=7.1")
            state=$(jq -r '.state' <<<"$now")
            if [ "$state" = "completed" ]; then break; fi
            sleep 20
          done
          if [ "$state" != "completed" ]; then echo "::error::Run $id had not finished after 20 minutes: $link"; exit 1; fi

          timeline=$(ado "https://dev.azure.com/$ORG/$PROJECT/_apis/build/builds/$id/timeline?api-version=7.1")
          steps=$(jq -c --arg task "$TASK" '[.records[] | select(.type == "Task" and .task.name == $task) | {name, result, version: .task.version}]' <<<"$timeline")
          echo "$steps" | jq -r '.[] | "\(.name): \(.result), task \(.version)"'
          count=$(jq 'length' <<<"$steps")
          if [ "$count" -lt 2 ]; then echo "::error::Run $id has $count $TASK steps, not 2: $link"; exit 1; fi
          wrong=$(jq -r --arg v "$TASK_VERSION" '[.[] | select(.version != $v)] | length' <<<"$steps")
          if [ "$wrong" -ne 0 ]; then echo "::error::Run $id ran $TASK at another version than $TASK_VERSION: $link"; exit 1; fi
          failed=$(jq -r '[.[] | select(.result != "succeeded")] | length' <<<"$steps")
          if [ "$failed" -ne 0 ]; then echo "::error::A Plotwork step of run $id failed: $link"; exit 1; fi
          echo "The smoke pipeline passed with $TASK $TASK_VERSION and @buun_group/plotwork@$CLI: $link" >> "$GITHUB_STEP_SUMMARY"
